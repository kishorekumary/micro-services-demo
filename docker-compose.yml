version: '3.8'
services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
      - xpack.security.enabled=false
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - es_data:/usr/share/elasticsearch/data

  kibana:
      image: docker.elastic.co/kibana/kibana:8.15.0
      environment:
        - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      ports:
        - "5601:5601"
      depends_on:
        - elasticsearch
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq/mnesia
    container_name: rabbitmq

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./app/models.sql:/docker-entrypoint-initdb.d/models.sql  # auto-init schema
    ports:
      - "5432:5432"
    container_name: postgres

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: >
      redis-server 
          --appendonly no
          --save 300 1

    container_name: redis
  minio:
    image: minio/minio
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    ports:
      - "9000:9000"     # API endpoint
      - "9001:9001"     # Web console
    volumes:
      - minio_data:/data

  minio-init:
      image: minio/mc
      depends_on:
        - minio
      entrypoint: >
        /bin/sh -c "
        sleep 5;
        mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin123};
        mc mb -p myminio/orders-bucket;
        exit 0;
        "
  fastapi:
    build: ./app
    ports:
      - "8000:8000"
    depends_on:
      - rabbitmq
      - postgres
      - redis
      - minio
      - elasticsearch
    volumes:
      - ./app:/app
    command: >
      sh -c "python init_db.py && python consumer.py & uvicorn main:app --host 0.0.0.0 --port 8000 --reload"

    container_name: fastapi

volumes:
  postgres_data:
  rabbitmq_data:
  redis_data:
  minio_data:
  es_data: